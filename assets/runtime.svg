<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="370">
  <defs>
    <linearGradient id="window-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .kw { fill: #ff7b72; font-weight: 500; }
    .type { fill: #79c0ff; }
    .var { fill: #f0f6fc; }
    .prop { fill: #d2a8ff; }
    .str { fill: #a5d6ff; }
    .comm { fill: #6e7681; font-style: italic; }
    .punct { fill: #8b949e; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes loopFade {
      0%, 2% { opacity: 0; }
      5%, 92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }

    .code-container {
      animation: loopFade 14s ease-in-out infinite;
    }

    .line-1  { opacity: 0; animation: fadeIn 0.3s ease forwards 0.3s; }
    .line-2  { opacity: 0; animation: fadeIn 0.3s ease forwards 0.9s; }
    .line-3  { opacity: 0; animation: fadeIn 0.3s ease forwards 1.5s; }
    .line-4  { opacity: 0; animation: fadeIn 0.3s ease forwards 2.1s; }
    .line-5  { opacity: 0; animation: fadeIn 0.3s ease forwards 2.7s; }
    .line-6  { opacity: 0; animation: fadeIn 0.3s ease forwards 3.3s; }
    .line-7  { opacity: 0; animation: fadeIn 0.3s ease forwards 3.9s; }
    .line-8  { opacity: 0; animation: fadeIn 0.3s ease forwards 4.5s; }
    .line-9  { opacity: 0; animation: fadeIn 0.3s ease forwards 5.1s; }
    .line-10 { opacity: 0; animation: fadeIn 0.3s ease forwards 5.7s; }
    .line-11 { opacity: 0; animation: fadeIn 0.3s ease forwards 6.3s; }

    .cursor {
      animation: cursorBlink 0.9s ease-in-out infinite;
      fill: #58a6ff;
    }
  </style>

  <!-- Frame Background with hairline stroke -->
  <rect x="0.5" y="0.5" width="799" height="369" rx="10" fill="url(#window-bg)" stroke="#27272a" stroke-width="1"/>

  <!-- Window Header -->
  <path d="M 0.5 10.5 A 10 10 0 0 1 10.5 0.5 L 789.5 0.5 A 10 10 0 0 1 799.5 10.5 L 799.5 36 L 0.5 36 Z" fill="#1b1b1e" stroke="#27272a" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5" fill="#28c840"/>

  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="400">
    AgentRuntime.ts
  </text>

  <!-- Code Body with absolute X and Y coordinates (immune to CSS transform bugs) -->
  <g class="code-container mono">
    <text x="32" y="72" class="line-1 comm">// Spawntel autonomous agent cluster runtime</text>

    <text x="32" y="98" class="line-2">
      <tspan class="kw">import</tspan>
      <tspan class="punct"> { </tspan>
      <tspan class="type">Cluster</tspan>
      <tspan class="punct">, </tspan>
      <tspan class="type">Specialist</tspan>
      <tspan class="punct"> } </tspan>
      <tspan class="kw">from</tspan>
      <tspan class="str">"@spawntel/mesh"</tspan>
      <tspan class="punct">;</tspan>
    </text>

    <text x="32" y="126" class="line-3">
      <tspan class="kw">export class</tspan>
      <tspan class="type"> AgentRuntime</tspan>
      <tspan class="punct"> {</tspan>
    </text>

    <text x="32" y="152" class="line-4">
      <tspan class="punct">  </tspan>
      <tspan class="kw">private readonly</tspan>
      <tspan class="var"> architect</tspan>
      <tspan class="punct"> = </tspan>
      <tspan class="str">"Kiuren Canete (Jay)"</tspan>
      <tspan class="punct">;</tspan>
    </text>

    <text x="32" y="178" class="line-5">
      <tspan class="punct">  </tspan>
      <tspan class="kw">private readonly</tspan>
      <tspan class="var"> capabilities</tspan>
      <tspan class="punct"> = [</tspan>
      <tspan class="str">"orchestration"</tspan>
      <tspan class="punct">, </tspan>
      <tspan class="str">"fullstack"</tspan>
      <tspan class="punct">, </tspan>
      <tspan class="str">"browser-automation"</tspan>
      <tspan class="punct">];</tspan>
    </text>

    <text x="32" y="206" class="line-6">
      <tspan class="punct">  </tspan>
      <tspan class="kw">async</tspan>
      <tspan class="prop"> dispatch</tspan>
      <tspan class="punct">(</tspan>
      <tspan class="var">goal</tspan>
      <tspan class="punct">: </tspan>
      <tspan class="type">string</tspan>
      <tspan class="punct">): </tspan>
      <tspan class="type">Promise</tspan>
      <tspan class="punct">&lt;</tspan>
      <tspan class="type">ExecutionResult</tspan>
      <tspan class="punct">&gt; {</tspan>
    </text>

    <text x="32" y="232" class="line-7 comm">    // Route to specialist, execute deterministically, verify output</text>

    <text x="32" y="258" class="line-8">
      <tspan class="punct">    </tspan>
      <tspan class="kw">const</tspan>
      <tspan class="var"> execution</tspan>
      <tspan class="punct"> = </tspan>
      <tspan class="kw">await</tspan>
      <tspan class="type"> Cluster</tspan>
      <tspan class="punct">.</tspan>
      <tspan class="prop">run</tspan>
      <tspan class="punct">({ </tspan>
      <tspan class="var">goal</tspan>
      <tspan class="punct">, </tspan>
      <tspan class="var">mode</tspan>
      <tspan class="punct">: </tspan>
      <tspan class="str">"autonomous"</tspan>
      <tspan class="punct"> });</tspan>
    </text>

    <text x="32" y="284" class="line-9">
      <tspan class="punct">    </tspan>
      <tspan class="kw">return</tspan>
      <tspan class="var"> execution</tspan>
      <tspan class="punct">.</tspan>
      <tspan class="prop">finalize</tspan>
      <tspan class="punct">();</tspan>
    </text>

    <text x="32" y="310" class="line-10">
      <tspan class="punct">  }</tspan>
    </text>

    <text x="32" y="336" class="line-11">
      <tspan class="punct">}</tspan>
      <tspan class="cursor"> ▋</tspan>
    </text>
  </g>
</svg>
