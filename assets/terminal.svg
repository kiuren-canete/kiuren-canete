<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13.5px;
      line-height: 22px;
    }
    .kw { fill: #ff7b72; font-weight: 600; }
    .fn { fill: #d2a8ff; font-weight: 600; }
    .str { fill: #a5d6ff; }
    .prop { fill: #79c0ff; }
    .type { fill: #ffa657; font-weight: 600; }
    .comment { fill: #8b949e; font-style: italic; }
    .punct { fill: #c9d1d9; }
    .success { fill: #3fb950; font-weight: 600; }
    
    @keyframes lineFadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes loopCycle {
      0%, 3% { opacity: 0; }
      5%, 92% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }

    .code-container {
      animation: loopCycle 15s ease-in-out infinite;
    }

    .l1 { animation: lineFadeIn 0.4s ease forwards 0.4s; opacity: 0; }
    .l2 { animation: lineFadeIn 0.4s ease forwards 1.2s; opacity: 0; }
    .l3 { animation: lineFadeIn 0.4s ease forwards 2.0s; opacity: 0; }
    .l4 { animation: lineFadeIn 0.4s ease forwards 2.8s; opacity: 0; }
    .l5 { animation: lineFadeIn 0.4s ease forwards 3.6s; opacity: 0; }
    .l6 { animation: lineFadeIn 0.4s ease forwards 4.4s; opacity: 0; }
    .l7 { animation: lineFadeIn 0.4s ease forwards 5.2s; opacity: 0; }
    .l8 { animation: lineFadeIn 0.4s ease forwards 6.0s; opacity: 0; }
    .l9 { animation: lineFadeIn 0.4s ease forwards 6.8s; opacity: 0; }
    .l10 { animation: lineFadeIn 0.4s ease forwards 7.6s; opacity: 0; }
    .l11 { animation: lineFadeIn 0.4s ease forwards 8.4s; opacity: 0; }
    
    .cursor {
      animation: blink 0.8s infinite;
      fill: #58a6ff;
    }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="818" height="398" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 807 1 A 12 12 0 0 1 819 13 L 819 40 L 1 40 Z" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Traffic Lights -->
  <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="410" y="25" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">
    ⚡ spawntel-core/runtime/agent-swarm.ts
  </text>

  <!-- Code Body -->
  <g class="code-container font-mono" transform="translate(28, 72)">
    <!-- Line 1 -->
    <g class="l1" transform="translate(0, 0)">
      <text class="comment">// 🧠 Spawntel Autonomous Multi-Agent Engine</text>
    </g>

    <!-- Line 2 -->
    <g class="l2" transform="translate(0, 26)">
      <text>
        <tspan class="kw">import</tspan>
        <tspan class="punct"> { </tspan>
        <tspan class="type">SwarmCluster</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="type">AutonomousRuntime</tspan>
        <tspan class="punct"> } </tspan>
        <tspan class="kw">from</tspan>
        <tspan class="str"> "@spawntel/agentic-mesh"</tspan>
        <tspan class="punct">;</tspan>
      </text>
    </g>

    <!-- Line 3 -->
    <g class="l3" transform="translate(0, 56)">
      <text>
        <tspan class="kw">const</tspan>
        <tspan class="prop"> cluster </tspan>
        <tspan class="punct">= </tspan>
        <tspan class="kw">new</tspan>
        <tspan class="type"> SwarmCluster</tspan>
        <tspan class="punct">({</tspan>
      </text>
    </g>

    <!-- Line 4 -->
    <g class="l4" transform="translate(0, 82)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="prop">architect</tspan>
        <tspan class="punct">: </tspan>
        <tspan class="str">"Kiuren Canete (Jay)"</tspan>
        <tspan class="punct">,</tspan>
      </text>
    </g>

    <!-- Line 5 -->
    <g class="l5" transform="translate(0, 108)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="prop">company</tspan>
        <tspan class="punct">: </tspan>
        <tspan class="str">"Spawntel"</tspan>
        <tspan class="punct">,</tspan>
      </text>
    </g>

    <!-- Line 6 -->
    <g class="l6" transform="translate(0, 134)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="prop">capabilities</tspan>
        <tspan class="punct">: [</tspan>
        <tspan class="str">"full-autonomy"</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="str">"browser-control"</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="str">"code-synthesis"</tspan>
        <tspan class="punct">],</tspan>
      </text>
    </g>

    <!-- Line 7 -->
    <g class="l7" transform="translate(0, 160)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="prop">roster</tspan>
        <tspan class="punct">: [</tspan>
        <tspan class="str">"Finn (CTO)"</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="str">"Cole (Chief)"</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="str">"Maya (Growth)"</tspan>
        <tspan class="punct">],</tspan>
      </text>
    </g>

    <!-- Line 8 -->
    <g class="l8" transform="translate(0, 186)">
      <text>
        <tspan class="punct">});</tspan>
      </text>
    </g>

    <!-- Line 9 -->
    <g class="l9" transform="translate(0, 218)">
      <text>
        <tspan class="kw">await</tspan>
        <tspan class="prop"> cluster</tspan>
        <tspan class="punct">.</tspan>
        <tspan class="fn">deploy</tspan>
        <tspan class="punct">({ </tspan>
        <tspan class="prop">goal</tspan>
        <tspan class="punct">: </tspan>
        <tspan class="str">"Convert complex workflows into deterministic software."</tspan>
        <tspan class="punct"> });</tspan>
      </text>
    </g>

    <!-- Line 10 -->
    <g class="l10" transform="translate(0, 252)">
      <text>
        <tspan class="comment">// 🚀 Output: System deployed successfully.</tspan>
      </text>
    </g>

    <!-- Line 11 -->
    <g class="l11" transform="translate(0, 278)">
      <text>
        <tspan class="success">✓ RUNTIME STATUS: ACTIVE • 974+ CONTRIBUTIONS SHIPPED</tspan>
        <tspan class="cursor"> ▋</tspan>
      </text>
    </g>
  </g>
</svg>