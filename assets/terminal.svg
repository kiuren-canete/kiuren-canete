<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="350">
  <defs>
    <linearGradient id="window-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 22px;
      letter-spacing: -0.01em;
    }
    .kw { fill: #ff7b72; font-weight: 500; }
    .type { fill: #79c0ff; }
    .var { fill: #f0f6fc; }
    .prop { fill: #d2a8ff; }
    .str { fill: #a5d6ff; }
    .comm { fill: #6e7681; font-style: italic; }
    .punct { fill: #8b949e; }

    @keyframes fadeLine {
      0% { opacity: 0; transform: translateY(2px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes cycleWindow {
      0%, 2% { opacity: 0; }
      4%, 93% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .code-flow {
      animation: cycleWindow 14s ease-in-out infinite;
    }

    .row-1 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s; opacity: 0; }
    .row-2 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.0s; opacity: 0; }
    .row-3 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.7s; opacity: 0; }
    .row-4 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.4s; opacity: 0; }
    .row-5 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 3.1s; opacity: 0; }
    .row-6 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 3.8s; opacity: 0; }
    .row-7 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 4.5s; opacity: 0; }
    .row-8 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 5.2s; opacity: 0; }
    .row-9 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 5.9s; opacity: 0; }
    .row-10 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 6.6s; opacity: 0; }
    .row-11 { animation: fadeLine 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards 7.3s; opacity: 0; }

    .cursor {
      animation: cursorBlink 0.9s ease-in-out infinite;
      fill: #58a6ff;
    }
  </style>

  <!-- Frame Background with hairline stroke -->
  <rect x="0.5" y="0.5" width="799" height="349" rx="10" fill="url(#window-bg)" stroke="#27272a" stroke-width="1"/>

  <!-- Window Header -->
  <path d="M 0.5 10.5 A 10 10 0 0 1 10.5 0.5 L 789.5 0.5 A 10 10 0 0 1 799.5 10.5 L 799.5 36 L 0.5 36 Z" fill="#1b1b1e" stroke="#27272a" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5" fill="#28c840"/>

  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="400">
    AgentRuntime.ts
  </text>

  <!-- Code Body -->
  <g class="code-flow mono" transform="translate(28, 64)">
    <g class="row-1" transform="translate(0, 0)">
      <text class="comm">// Spawntel autonomous agent cluster runtime</text>
    </g>

    <g class="row-2" transform="translate(0, 24)">
      <text>
        <tspan class="kw">import</tspan>
        <tspan class="punct"> { </tspan>
        <tspan class="type">Cluster</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="type">Specialist</tspan>
        <tspan class="punct"> } </tspan>
        <tspan class="kw">from</tspan>
        <tspan class="str"> "@spawntel/mesh"</tspan>
        <tspan class="punct">;</tspan>
      </text>
    </g>

    <g class="row-3" transform="translate(0, 50)">
      <text>
        <tspan class="kw">export class</tspan>
        <tspan class="type"> AgentRuntime</tspan>
        <tspan class="punct"> {</tspan>
      </text>
    </g>

    <g class="row-4" transform="translate(0, 74)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="kw">private readonly</tspan>
        <tspan class="var"> architect</tspan>
        <tspan class="punct"> = </tspan>
        <tspan class="str">"Kiuren Canete (Jay)"</tspan>
        <tspan class="punct">;</tspan>
      </text>
    </g>

    <g class="row-5" transform="translate(0, 98)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="kw">private readonly</tspan>
        <tspan class="var"> capabilities</tspan>
        <tspan class="punct"> = [</tspan>
        <tspan class="str">"orchestration"</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="str">"fullstack"</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="str">"browser-control"</tspan>
        <tspan class="punct">];</tspan>
      </text>
    </g>

    <g class="row-6" transform="translate(0, 124)">
      <text>
        <tspan class="punct">  </tspan>
        <tspan class="kw">async</tspan>
        <tspan class="prop"> dispatch</tspan>
        <tspan class="punct">(</tspan>
        <tspan class="var">goal</tspan>
        <tspan class="punct">: </tspan>
        <tspan class="type">string</tspan>
        <tspan class="punct">): </tspan>
        <tspan class="type">Promise</tspan>
        <tspan class="punct">&lt;</tspan>
        <tspan class="type">ExecutionResult</tspan>
        <tspan class="punct">&gt; {</tspan>
      </text>
    </g>

    <g class="row-7" transform="translate(0, 148)">
      <text>
        <tspan class="punct">    </tspan>
        <tspan class="comm">// Route to specialist, execute deterministically, verify output</tspan>
      </text>
    </g>

    <g class="row-8" transform="translate(0, 172)">
      <text>
        <tspan class="punct">    </tspan>
        <tspan class="kw">const</tspan>
        <tspan class="var"> execution</tspan>
        <tspan class="punct"> = </tspan>
        <tspan class="kw">await</tspan>
        <tspan class="type"> Cluster</tspan>
        <tspan class="punct">.</tspan>
        <tspan class="prop">run</tspan>
        <tspan class="punct">({ </tspan>
        <tspan class="var">goal</tspan>
        <tspan class="punct">, </tspan>
        <tspan class="var">mode</tspan>
        <tspan class="punct">: </tspan>
        <tspan class="str">"autonomous"</tspan>
        <tspan class="punct"> });</tspan>
      </text>
    </g>

    <g class="row-9" transform="translate(0, 196)">
      <text>
        <tspan class="punct">    </tspan>
        <tspan class="kw">return</tspan>
        <tspan class="var"> execution</tspan>
        <tspan class="punct">.</tspan>
        <tspan class="prop">finalize</tspan>
        <tspan class="punct">();</tspan>
      </text>
    </g>

    <g class="row-10" transform="translate(0, 220)">
      <text>
        <tspan class="punct">  }</tspan>
      </text>
    </g>

    <g class="row-11" transform="translate(0, 244)">
      <text>
        <tspan class="punct">}</tspan>
        <tspan class="cursor"> ▋</tspan>
      </text>
    </g>
  </g>
</svg>